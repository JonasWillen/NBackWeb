<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Dual N-back working-memory game" />
  <meta name="theme-color" content="#1e293b" />
  <title>NBackWeb — Dual N-back</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- HOME -->
  <section id="home-screen" class="screen">
    <h1>N-back</h1>
    <div>
      <div class="muted">Best score</div>
      <div class="big-score" id="home-best">0</div>
    </div>
    <div class="mode-picker">
      <button class="btn mode-btn" data-mode="visual"><span class="emoji">👀</span>Visual<span class="desc">Grid positions</span></button>
      <button class="btn mode-btn" data-mode="audio"><span class="emoji">🔊</span>Audio<span class="desc">Spoken letters</span></button>
      <button class="btn mode-btn" data-mode="dual"><span class="emoji">⚡</span>Dual<span class="desc">Both at once</span></button>
    </div>
    <div class="settings-summary" id="home-summary"></div>
    <div class="mode-picker">
      <button class="btn subtle" id="home-settings">⚙️ Settings</button>
      <button class="btn subtle" id="home-scores">🏆 High scores</button>
    </div>
    <a href="ux-lab.html" style="color:#94a3b8;font-size:0.85rem">🧪 UX Lab — alternative design concepts</a>
  </section>

  <!-- GAME -->
  <section id="game-screen" class="screen">
    <div class="status-bar" id="game-status" style="display:none">
      <span>Event <strong id="game-event-num">0</strong>/<strong id="game-event-total">0</strong></span>
      <span>Correct <strong id="game-correct">0</strong></span>
    </div>
    <div class="grid" id="game-grid"></div>
    <div class="match-buttons">
      <button class="btn match-btn" id="btn-match-visual">👁 Position match</button>
      <button class="btn match-btn" id="btn-match-audio">👂 Sound match</button>
    </div>
    <div style="display:flex; gap:0.6rem">
      <button class="btn subtle" id="game-home">Home</button>
    </div>
    <div id="game-start-overlay" style="display:flex; flex-direction:column; gap:0.8rem; align-items:center">
      <p class="muted">Tap <strong>Position/Sound match</strong> when the stimulus repeats from <strong>n</strong> steps back.</p>
      <button class="btn primary" id="game-start">▶ Start round</button>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="settings-screen" class="screen">
    <h2>⚙️ Settings</h2>
    <form class="form" onsubmit="return false">
      <div class="field">
        <label for="set-modality">Modality</label>
        <select id="set-modality">
          <option value="visual">Visual</option>
          <option value="audio">Audio</option>
          <option value="dual">Dual</option>
        </select>
      </div>
      <div class="field">
        <label for="set-n">n-back level</label>
        <input type="number" id="set-n" min="1" max="9" />
      </div>
      <div class="field">
        <label for="set-events">Events per round</label>
        <input type="number" id="set-events" min="5" max="100" />
      </div>
      <div class="field">
        <label for="set-interval">Time between events (ms)</label>
        <input type="number" id="set-interval" min="1000" max="6000" step="500" />
      </div>
      <div class="field">
        <label for="set-grid">Grid size (N×N)</label>
        <input type="number" id="set-grid" min="2" max="6" />
      </div>
      <div class="field">
        <label for="set-letters">Spoken letters</label>
        <input type="number" id="set-letters" min="2" max="8" />
      </div>
      <div style="display:flex; gap:0.6rem">
        <button class="btn primary" id="settings-save" type="button">Save</button>
        <button class="btn subtle" id="settings-back" type="button">Back</button>
      </div>
    </form>
  </section>

  <!-- SCORES -->
  <section id="scores-screen" class="screen">
    <h2>🏆 High scores</h2>
    <div class="sort-picker">
      <button class="btn subtle sort-btn selected" data-sort="score">Score</button>
      <button class="btn subtle sort-btn" data-sort="name">Name</button>
      <button class="btn subtle sort-btn" data-sort="date">Date</button>
    </div>
    <ul class="scores-list" id="scores-list"></ul>
    <button class="btn subtle" id="scores-back">Back</button>
  </section>

  <!-- SUMMARY -->
  <section id="summary-screen" class="screen">
    <h2>Round complete!</h2>
    <div class="summary-stats" id="summary-rows"></div>
    <div class="save-row">
      <input type="text" id="summary-name" maxlength="20" placeholder="Your name" />
      <button class="btn primary" id="summary-save">Save score</button>
    </div>
    <div style="display:flex; gap:0.6rem">
      <button class="btn" id="summary-replay">↻ Play again</button>
      <button class="btn subtle" id="summary-home">Home</button>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
