<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Dual N-back working-memory game" />
  <meta name="theme-color" content="#1e293b" />
  <title>NBackWeb — Dual N-back</title>
  <style>
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    h1 { font-size: clamp(1.75rem, 6vw, 3rem); margin: 0; }
    p { font-size: clamp(1rem, 3.5vw, 1.25rem); color: var(--accent); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, N-back!</h1>
    <p>Dual N-back game — coming soon.</p>
  </main>
</body>
</html>
